<!doctype html>
<html><head><meta charset="utf-8">
<script>(function(){try{var t=localStorage.getItem("drift-theme")||"system";var d=t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";}catch(e){}})();</script>
<link rel="stylesheet" href="styles.css"></head>
<body style="padding: 12px 16px;">
  <div style="display:flex; align-items:center; gap:7px; margin-bottom:4px;">
    <span id="t-glyph" style="width:16px; height:16px; flex-shrink:0; color:var(--accent); display:inline-flex;"></span>
    <span id="t-title" style="font-size:13px; color:var(--ink); font-weight:600;"></span>
  </div>
  <div id="t-name" style="font-size:11px; margin-bottom:10px; color: var(--ink-soft);
       white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
  <div style="display:flex; gap:8px; justify-content:flex-end">
    <button class="btn-ghost" id="t-dismiss">Dismiss</button>
    <button class="btn-primary" id="t-action">Yes</button>
  </div>
  <script type="module" src="toast.js"></script>
</body></html>
